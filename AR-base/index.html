<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>p5.simpleAR</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://tetunori.github.io/p5.simpleAR/dist/v0.7.0/p5SimpleAR.js"></script>
</head>
<body>
<script>
function setup() {
  createARCanvas(240, 240);
  noStroke();
}

function draw() {
  background(30);
  fill(255, 100, 100);
  circle(width / 2 + sin(frameCount * 0.05) * 60, height / 2, 80);
}
</script>
</body>
</html>
